{% extends 'core/base.html' %}

{% block title %}
  Detalhes da Mensagem | Site Das Primas
{% endblock %}

{% block content %}

<section class="pagina-detalhes-mensagem">

    <div class="container-detalhes-mensagem">
        <h1>Detalhes da Mensagem</h1>
    </div>

    <div class="detalhes-mensagem">

        <span class="detalhes-mensagem-icone">💋</span>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

   
</form>

        <a href="{% url 'core:editar_mensagem' mensagem.id %}">
            Editar
        </a>

        <a href="{% url 'core:excluir_mensagem' mensagem.id %}">
            Excluir
        </a>

    </div>

</section>

{% endblock %}
